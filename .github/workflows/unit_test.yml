# CI：bbtools-coroutine 正式普通门禁流水线（hosted-only，普通 check 唯一 producer）
#
# 来源与边界：本文件由已合并并在线跑通的 hosted Layer1 影子（`.github/workflows/ci-shadow-v1.yml`，
# 线上 run 37885875199 / 37885869769：CTest/smoke/reliability 与结果汇聚 success）升级而来。
# 影子入口已在本候选删除，普通 check 只有本文件一个 producer（非双跑）。workflow 名 `CI` 与
# workflow path `.github/workflows/unit_test.yml` 保持不变——`scripts/release_gate.py`
# 的 `validate_main_ci` 按这个 path 精确读取 main push run。
#
# 覆盖（普通 PR / push main，分钟级，全 hosted ubuntu-24.04）：
#   变更类型检测（真实 diff）→ 复用已发布 fixed-SHA framework 分类 callee → 编译 & 单元测试
#   → 结果汇聚（always，fail-closed）。
#
# 性能路径（本候选**新接线**，非冻结）：`性能回归检查` 由「等待外部 commit comment 的受控报告
#   消费者」改为**同 runner 自动 base/head 真实构建+测量比较**（见下）：同一 job 顺序构建两棵隔离
#   源码/构建树、用 head driver 分别测量六模块 45s×2threads，head 以 base 报告为临时基线严格比较。
#   hosted 仍**不**回退旧 arc-s4；required 仍含 `性能回归检查`（app 15368），本轮**不修改 required**，
#   也不改 `release_gate.py`（它按名字读 success job）。详细边界见 `agent-docs/perf-check-wiring.md`。
#   设计边界：同 runner 短测只覆盖 base↔head 同机相对退化，**不是** server3 长期基线。
# 本文件**不承载**（本轮冻结，未迁移）：
#   - Sanitizer（ASAN+UBSAN）长测：旧 unit_test.yml 的 sanitizer-check 需要 `workflow_dispatch`
#     事件才可达，而旧 `on:` 从未声明 workflow_dispatch，故该 job 实际不可达、不属于普通适用测试。
#     本轮不开启新的长期执行（不新增 sanitizer 触发）；该 job 从本文件移除，配置保留在 git 历史
#     （HEAD c704458 的旧 unit_test.yml）中，需单独迁移为独立 workflow 后再启用。
#
#   - `性能回归检查`（app 15368，required context 名）本轮由**受控报告消费者**改为**同 runner
#     base/head 真实测量比较**：同一 hosted job 内顺序构建 base 与 head 的 `unified_stress`，用
#     **head 的** `ci_perf_check.py` 分别测量（base 无基线 → NO_COMPARABLE_BASELINE，只作 runner
#     临时基线，**不是** PASS 声明；head 以该报告为基线 + `--strict-comparable --gate-enabled`
#     严格比较）。缺证据（无基线/缺模块/环境不可比）、errors>0、zero ops、缺损指标、NaN/inf 一律
#     exit 2，**不**以 skipped/空成功置绿。基线仅 runner 临时，**不**写正式 perf-baseline、**不**改
#     仓库变量、**不**触碰 `release_gate.py`；required 集合本轮不改。信任边界与判定链见
#     `agent-docs/perf-check-wiring.md`。
#
# 说明性文档：`agent-docs/formal-ci.md`（本候选由 agent-docs/ci-shadow-v1.md 改名并改写为正式说明）。
# `docs/ci-guide.md` / `agent-docs/development-and-release-process.md` 仍是旧流程真源，其 unit_test.yml
# 描述与本候选不一致处按 formal-ci.md 的「阶段限定维护窗」处理，**不视为迁移已完成**。
#
# 安全：全部本地 job 固定 hosted `ubuntu-24.04`；顶层 `permissions: {}`，仅需要 checkout 的 job
# 授予 `contents: read`；无 secret / OIDC / 写权限 / secrets 透传；远程 `uses` 全部完整 40-hex SHA pin。
# 公开仓库：fork PR 执行的是 PR head 里的 workflow 文件，YAML 内 `if` 挡不住被替换的文件。仓库
# Actions `approval_policy` 只读回读为 all_external_contributors（2026-10-09），不得批准未审查的
# fork workflow；该策略不构成准入或隔离保证（有写权限者批准后仍会执行未审查的 workflow）。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  # push/main：group 含 run_id → 逐提交独立、互不取消（保住每个 SHA 的 main 结果，Release 消费者
  # 按 head_sha 精确读取）；PR：group 用 github.ref（refs/pull/<N>/merge）→ 只取消同一 PR 的旧 run。
  group: CI-${{ github.event_name == 'pull_request' && github.ref || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILD_DIR: ${{ github.workspace }}/build
  BOOST_PREFIX: ${{ github.workspace }}/boost-prefix
  # hosted 4 vCPU：固定 3，与三仓统一并发口径一致，不按 nproc 抢占。
  JOBS: 3

jobs:
  # 变更集：从真实 diff 归一为受限路径列表，交给 framework classify callee 分类。
  # 任何无法确定的情形保守回退为 unknown（callee 判定执行全部），绝不擅自判绿。
  # job 名沿用现役 `变更类型检测`，required context 不悬空。
  changes:
    name: "变更类型检测"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      changed_files_json: ${{ steps.diff.outputs.changed_files_json }}
      classifier_status: ${{ steps.diff.outputs.classifier_status }}
      event_json: ${{ steps.diff.outputs.event_json }}
    steps:
      - name: "拉取代码库（含历史，供三点 diff）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: "从真实 diff 计算受限变更集（未知保守全部）"
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/ci/changed_files.py

  # 分类/计划（classification-only）：只调用已发布 callee，不传 results。
  plan:
    name: "分类/计划（framework classify callee）"
    needs: [changes]
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@ce247be9d3473432e0da6c204481ad9403c430bb
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      event_json: ${{ needs.changes.outputs.event_json }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json }}
      # required = 恒跑且决定「不得全跳过变绿」的轻量 job；optional = 重型构建 job
      # （仅 docs-only 允许显式跳过）。集合互斥、非空，由 callee 校验。
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["build"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status }}

  # 重型构建 + 全量 ctest + smoke + reliability：仅当分类为 code/unknown 时运行；docs-only 显式跳过
  # （跳过由 callee 的 optional 语义显式允许，不靠空成功 alias 把 job 结果伪造为 success）。
  # job 名沿用现役 required check 名 `编译 & 单元测试`。
  build:
    name: "编译 & 单元测试"
    needs: [changes, plan]
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.classification != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "复现工具链（Boost 1.90 context 源码前缀）"
        run: bash scripts/ci/prepare_boost.sh "$BOOST_PREFIX" --jobs "$JOBS"

      - name: "导出工具链前缀到后续步骤"
        run: |
          echo "BOOST_ROOT=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BOOST_PREFIX/lib:$BUILD_DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: "采集 runner 调度与工具链日志（证据）"
        run: |
          printf 'runner=%s\n' "$RUNNER_NAME"
          nproc
          ulimit -r || true
          grep -E 'Cap(Prm|Eff|Bnd)' /proc/self/status || true
          cmake --version | head -1
          g++ --version | head -1
          ninja --version || true
          python3 --version

      - name: "编译"
        run: |
          rm -rf build && mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEED_TEST=ON -DNEED_BENCHMARK=ON
          cmake --build . --parallel "$JOBS"

      - name: "CI 与发布工具自测"
        run: |
          python3 scripts/test_release_gate.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: "ctest（全部单元测试）"
        run: |
          cd build
          # 有界重试最多 3 次，应对间歇性 flaky 测试；每次 attempt 独立进程，失败证据留在 job 日志中。
          # 总时长由 step 级 timeout-minutes 界定，不过度限制单次 ctest。
          for i in 1 2 3; do
            ctest --timeout 60 --output-on-failure && exit 0
            echo "ctest attempt $i failed, retrying..."
          done
          exit 1
        timeout-minutes: 10

      - name: "冒烟测试（Test_smoke）"
        run: |
          cd build
          # flaky 卡死：最多重试 3 次（每次全新进程）。
          for i in 1 2 3; do
            timeout --signal=TERM --kill-after=10s 90s bin/unit_test/Test_smoke --log_level=test_suite && exit 0
            echo "Test_smoke attempt $i failed, retrying..."
          done
          exit 1
        timeout-minutes: 8

      - name: "可靠性测试（Test_reliability）"
        run: |
          cd build
          # flaky 卡死/段错误：最多重试 3 次（每次全新进程）。
          for i in 1 2 3; do
            timeout --signal=TERM --kill-after=10s 120s bin/unit_test/Test_reliability --log_level=test_suite && exit 0
            echo "Test_reliability attempt $i failed, retrying..."
          done
          exit 1
        timeout-minutes: 8

  # ── 性能回归检查：同 runner 顺序构建/测量 base+head 真实对比（fail-closed）────────────────
  # 信任边界：只读 hosted job（permissions: contents: read）；**无** secret / 写权限 /
  # pull_request_target / self-hosted；远程 uses 全部完整 40-hex SHA pin；persist-credentials: false。
  # subject/base：PR = head.sha / base.sha；push main = github.sha / event.before。三项硬校验
  # （完整 40-hex、非零、可达），任一失败即 fail-closed；**不用** HEAD^ 猜测，零 SHA（首推）直接拒绝。
  # 同一 job、同一 runner **顺序**构建两棵隔离源码/构建树（base 先、head 后），用 **head 的** driver
  # （ci_perf_check.py）分别测量：base 无基线测量（NO_COMPARABLE_BASELINE，只作 runner 临时基线，
  # **不是** PASS 声明）；head 以该报告为基线 + --strict-comparable --gate-enabled 严格比较，拒绝
  # 缺损指标 / errors>0 / zero ops / 缺 base 模块 / 环境不可比 / NaN·inf——缺证据一律 exit 2。
  # 只构建 unified_stress 目标（**不**跑全量 CTest）；六模块 45s × 2 threads。基线仅 runner 临时，
  # **不**触碰正式 perf-baseline / 仓库变量 / release_gate。
  # 设计边界（ponytail ceiling）：同 runner 短测只覆盖 base↔head **同机**相对退化，不是 server3
  # 长期基线；跨机/长期趋势仍由 record_baseline.py + perf-baseline 分支承担，本轮不接。
  perf-regression:
    name: "性能回归检查"
    # 事件面显式限定为本 workflow 的普通触发；不响应 workflow_dispatch/其他事件。
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # hosted 4 vCPU：构建并行度固定 3，与普通门禁口径一致。
      PERF_JOBS: 3
      # subject：PR=head.sha（真实 head，不冒充 merge commit），push=github.sha。
      PERF_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      # base：PR=base.sha，push=event.before（上一 main 头；零 SHA 在上一步被拒）。
      PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
    steps:
      - name: "校验 subject/base SHA（完整 40-hex、非零）"
        run: |
          set -euo pipefail
          require_sha() {
            name="$1"; value="$2"
            case "$value" in
              ''|*[!0-9a-f]*) echo "FATAL: $name 不是完整小写 40-hex SHA: '$value'" >&2; exit 2 ;;
            esac
            [ "${#value}" -eq 40 ] || { echo "FATAL: $name 长度非 40: '$value'" >&2; exit 2; }
            [ "$value" != "0000000000000000000000000000000000000000" ] \
              || { echo "FATAL: $name 为零 SHA（无对应提交，如首次推送）" >&2; exit 2; }
          }
          require_sha subject "$PERF_SUBJECT_SHA"
          require_sha base "$PERF_BASE_SHA"
          echo "subject=$PERF_SUBJECT_SHA"
          echo "base=$PERF_BASE_SHA"

      - name: "拉取 subject(head) 源码树（完整历史，显式 SHA）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: perf-src-head

      - name: "拉取 base 源码树（完整历史，显式 SHA）"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          fetch-depth: 0
          persist-credentials: false
          path: perf-src-base

      - name: "核验两棵源码树绑定各自完整 SHA（不可达/不符即失败）"
        run: |
          set -euo pipefail
          for pair in "perf-src-head:$PERF_SUBJECT_SHA" "perf-src-base:$PERF_BASE_SHA"; do
            dir="${pair%%:*}"; want="${pair##*:}"
            git -C "$dir" cat-file -e "$want^{commit}" \
              || { echo "FATAL: $want 在 $dir 中不可达" >&2; exit 2; }
            got="$(git -C "$dir" rev-parse HEAD)"
            [ "$got" = "$want" ] \
              || { echo "FATAL: $dir HEAD=$got 与期望 $want 不符" >&2; exit 2; }
          done

      - name: "复现工具链（Boost 1.90 context 源码前缀）"
        run: bash perf-src-head/scripts/ci/prepare_boost.sh "$BOOST_PREFIX" --jobs "$PERF_JOBS"

      - name: "导出工具链前缀到后续步骤"
        run: |
          echo "BOOST_ROOT=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$BOOST_PREFIX" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$BOOST_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: "顺序构建 base 的 unified_stress（仅该目标，不跑全量 CTest）"
        run: |
          set -euo pipefail
          cmake -S perf-src-base -B perf-build-base -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNEED_BENCHMARK=ON -DNEED_TEST=OFF
          cmake --build perf-build-base --target unified_stress --parallel "$PERF_JOBS"

      - name: "顺序构建 head 的 unified_stress（仅该目标，不跑全量 CTest）"
        run: |
          set -euo pipefail
          cmake -S perf-src-head -B perf-build-head -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DNEED_BENCHMARK=ON -DNEED_TEST=OFF
          cmake --build perf-build-head --target unified_stress --parallel "$PERF_JOBS"

      - name: "base 无基线测量（runner 临时基线；NO_COMPARABLE_BASELINE 不是 PASS）"
        run: |
          set -euo pipefail
          python3 perf-src-head/scripts/ci_perf_check.py \
            --build-dir perf-build-base \
            --commit-sha "$PERF_BASE_SHA" \
            --no-baseline-compare --dur 45 --threads 2 \
            --output perf-base-report.json

      - name: "head 严格同 runner 对比（缺证据/errors>0/环境不可比 → exit 2）"
        run: |
          set -euo pipefail
          python3 perf-src-head/scripts/ci_perf_check.py \
            --build-dir perf-build-head \
            --commit-sha "$PERF_SUBJECT_SHA" \
            --baseline perf-base-report.json \
            --strict-comparable --gate-enabled --dur 45 --threads 2 \
            --output perf-head-report.json

  # 结果汇聚：**always** 运行，把三个真实 job 结果交给已发布 callee 的 result 契约。
  # 必跑（required）失败/cancelled/空/意外 skipped → verdict=failure → 调用非零失败。
  result:
    name: "结果汇聚（framework result callee）"
    needs: [changes, plan, build]
    if: ${{ always() }}
    uses: yqm-307/bbt-framework/.github/workflows/bbtools-classify-v1.yml@ce247be9d3473432e0da6c204481ad9403c430bb
    permissions:
      contents: read
    with:
      repo: ${{ github.repository }}
      source_sha: ${{ github.sha }}
      profile: hosted
      concurrency: "2"
      timeout_minutes: "60"
      # 复用与 plan 相同的受限输入；changes 失败时其 outputs 为空，显式回退为保守值
      # （空变更 + unknown → callee 判 unknown→执行全部），使 result 仍能汇聚真实 job 结果。
      event_json: ${{ needs.changes.outputs.event_json || format('{{"name":"{0}"}}', github.event_name) }}
      changed_files_json: ${{ needs.changes.outputs.changed_files_json || '[]' }}
      required_checks_json: '["changes","plan"]'
      optional_checks_json: '["build"]'
      classifier_status: ${{ needs.changes.outputs.classifier_status || 'unknown' }}
      # 汇聚三个真实 job 的 needs.*.result（含 skipped），不构造假状态、不省略键。
      results_json: ${{ format('{{"changes":"{0}","plan":"{1}","build":"{2}"}}', needs.changes.result, needs.plan.result, needs.build.result) }}
