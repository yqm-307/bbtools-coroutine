# CI：bbtools-coroutine 三级门禁流水线
#
# Layer 1 (每次 PR/commit): 编译 → ctest → Test_smoke → Test_reliability      ~90s
# Layer 2 (每次 PR):        快速性能回归检查（unified_stress 45s/模块）        ~5min
# Layer 3 (push main only): 1h 并行疲劳压测 + 记录新基线                       ~70min
#
# 契约参考: docs/ci-guide.md
# 公开仓库 + 常驻 self-hosted：fork PR 会执行 PR head 里的 workflow，
# YAML 内 if 挡不住被替换的文件。硬闸门是仓库 Actions
# approval_policy=all_external_contributors；不得批准未审查的 fork workflow。

name: CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  BUILD_DIR: ${{ github.workspace }}/build
  BASELINE_DIR: ${{ github.workspace }}/tests/baselines

# 同一 ref 的 run 排队而不是互相取消：main 的 1h 压测被后续 push
# 取消会丢基线（历史 8 次 main run 全被 cancel 的根因）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ════════════════════════════════════════════════════════
  # Layer 1: 编译 + 单元测试 + 冒烟测试 + 可靠性测试
  # 每次 PR/commit 必跑，~90s
  # ════════════════════════════════════════════════════════
  build-and-test:
    name: "编译 & 单元测试"
    runs-on: ["self-hosted", "linux"]
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "编译"
        run: |
          rm -rf build && mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEED_TEST=ON -DNEED_BENCHMARK=ON
          ninja -j$(nproc)

      - name: "CI 与发布工具自测"
        run: |
          python3 scripts/test_release_gate.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'

      - name: "采集 runner 调度能力"
        if: always()
        run: |
          printf 'runner=%s\n' "$RUNNER_NAME"
          nproc
          ulimit -r || true
          grep -E 'Cap(Prm|Eff|Bnd)' /proc/self/status || true

      - name: "ctest（全部单元测试）"
        run: |
          cd build
          # 重试最多 3 次，应对间歇性 flaky 测试
          # 注意：CI 环境性能较差，ctest 耗时显著高于本地（~180s vs ~60s）
          # 用 step 级 timeout-minutes 控制总时长，不过度限制单次 ctest
          for i in 1 2 3; do
            ctest --timeout 60 --output-on-failure && exit 0
            echo "ctest attempt $i failed, retrying..."
          done
          exit 1
        timeout-minutes: 10

      - name: "冒烟测试（Test_smoke）"
        run: |
          cd build
          # flaky 卡死：最多重试 3 次（每次全新进程），保证 CI 稳定
          for i in 1 2 3; do
            timeout --signal=TERM --kill-after=10s 90s bin/unit_test/Test_smoke --log_level=test_suite && exit 0
            echo "Test_smoke attempt $i failed, retrying..."
          done
          exit 1
        timeout-minutes: 8

      - name: "可靠性测试（Test_reliability）"
        run: |
          cd build
          # flaky 卡死/段错误：最多重试 3 次（每次全新进程），保证 CI 稳定
          for i in 1 2 3; do
            timeout --signal=TERM --kill-after=10s 120s bin/unit_test/Test_reliability --log_level=test_suite && exit 0
            echo "Test_reliability attempt $i failed, retrying..."
          done
          exit 1
        timeout-minutes: 8

  # ════════════════════════════════════════════════════════
  # main: 真实第三方客户端验收
  # ════════════════════════════════════════════════════════
  real-client-acceptance:
    name: "真实客户端验收"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test]
    runs-on: ["self-hosted", "linux"]
    timeout-minutes: 10
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "编译示例和验收目标"
        run: |
          rm -rf build && mkdir build && cd build
          cmake .. -G Ninja -DNEED_EXAMPLE=ON -DNEED_TEST=OFF -DNEED_BENCHMARK=OFF
          ninja -j2 echo_server co_with_hiredis

      - name: "执行真实客户端验收"
        run: |
          python3 scripts/acceptance_real_clients.py \
            --echo-server ./build/bin/example/echo_server \
            --hiredis ./build/bin/example/co_with_hiredis

  # ════════════════════════════════════════════════════════
  # Layer 2: 快速性能回归检查（仅 push main）
  # 每模块 45s 串行，~5min
  # ════════════════════════════════════════════════════════
  perf-regression:
    name: "性能回归检查"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test]
    runs-on: ["self-hosted", "linux"]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "编译（复用 build 产物？不 — 独立 build 目录保证一致性）"
        run: |
          rm -rf build && mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEED_TEST=ON -DNEED_BENCHMARK=ON
          ninja -j$(nproc)

      - name: "拉取历史性能基线（perf-baseline 分支）"
        # 临时 checkout 里没有历史基线；长期记录在 orphan 分支 perf-baseline，
        # artifact 仅作传输。分支缺失时 ci_perf_check 显式输出 NO_COMPARABLE_BASELINE。
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code origin refs/heads/perf-baseline >/dev/null 2>&1; then
            git fetch --depth=1 origin refs/heads/perf-baseline
            mkdir -p tests
            # checkout 失败（路径缺失/损坏）不得红叉：继续走 NO_COMPARABLE_BASELINE
            git checkout FETCH_HEAD -- tests/baselines || echo "⚠️ baseline checkout failed"
            echo "Baselines available:"; ls -la tests/baselines/*/ | head -20
          else
            echo "⚠️ no perf-baseline branch — check will report NO_COMPARABLE_BASELINE"
          fi

      - name: "快速性能回归检查"
        # --gate-enabled：退化 ≥20%（CoCond ≥40%）判 FAIL 并阻断 main 验证
        run: |
          python3 scripts/ci_perf_check.py --threads=2 --dur=45 --gate-enabled --output tests/ci-reports/main-performance.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('tests/ci-reports/main-performance.json').read_text())
          modules = report.get('modules', {})
          assert set(modules) == {'comutex', 'corwmutex', 'cocond', 'chan', 'copool', 'coroutine'}
          allowed = {'PASS', 'WARN', 'NO_COMPARABLE_BASELINE'}
          assert report.get('verdict') in allowed, report.get('verdict')
          assert all(m.get('status') in allowed and m.get('errors') == 0 for m in modules.values())
          if any(m.get('status') == 'NO_COMPARABLE_BASELINE' for m in modules.values()):
              print('::warning::NO_COMPARABLE_BASELINE：main 缺少性能可比性证据；允许建立首份基线，发布仍阻断')
          PY

      - name: "上传压测日志"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression-logs
          path: tests/ci-reports/
          if-no-files-found: ignore
          retention-days: 3

  # ════════════════════════════════════════════════════════
  # Layer 3: 1h 并行疲劳压测 + 基线记录（仅 push main）
  # ════════════════════════════════════════════════════════
  stress-test:
    name: "1h 并行疲劳压测"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test, real-client-acceptance, perf-regression]
    runs-on: ["self-hosted", "linux"]
    timeout-minutes: 90
    permissions:
      contents: write  # 仅用于推送 perf-baseline 分支基线
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "编译"
        run: |
          rm -rf build && mkdir build && cd build
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEED_TEST=ON -DNEED_BENCHMARK=ON
          ninja -j$(nproc)

      - name: "1h 并行压测"
        run: INTERVAL=60 bash scripts/run_parallel_stress.sh 3600 2

      - name: "拉取历史基线（供趋势比较与合并推送）"
        if: success()
        run: |
          if git ls-remote --exit-code origin refs/heads/perf-baseline >/dev/null 2>&1; then
            git fetch --depth=25 origin refs/heads/perf-baseline
            git checkout FETCH_HEAD -- tests/baselines || true
          else
            echo "⚠️ no perf-baseline branch yet"
          fi

      - name: "上传压测报告"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-report
          path: tests/reports/
          if-no-files-found: warn
          retention-days: 7

      - name: "记录性能基线"
        if: success()
        # record_baseline.py 内置写入闸门：任一模块 no_data/无效指标即
        # exit 2 拒绝落盘，本步骤失败即不推送，好基线不会被坏数据覆盖
        run: |
          python3 scripts/record_baseline.py record --threads=2 --dur=60 --quick
          echo "Baseline recorded:"
          ls -la tests/baselines/*/

      - name: "趋势检查（连续小幅退化）"
        if: success()
        # 非阻断：发现趋势时打印要求 + warning 注解，按维护策略开专项 Issue
        run: |
          if ! python3 scripts/record_baseline.py trend; then
            echo "::warning::检测到连续性能退化趋势，请创建专项修复 Issue（见 docs/ci-guide.md）"
          fi

      - name: "推送基线到 perf-baseline 分支（长期记录）"
        if: success()
        # artifact 只作传输；长期可追溯 = perf-baseline orphan 分支。
        # 每机器目录保留最近 20 份，旧的清理（保留规则见 docs/ci-guide.md）
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          work="$(mktemp -d)"; cd "$work"
          git init -q bl && cd bl
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code origin refs/heads/perf-baseline >/dev/null 2>&1; then
            git fetch -q --depth=25 origin refs/heads/perf-baseline
            git checkout -q -b perf-baseline FETCH_HEAD
          else
            git checkout -q --orphan perf-baseline
          fi
          mkdir -p tests/baselines
          cp -r "$GITHUB_WORKSPACE/tests/baselines/." tests/baselines/
          for d in tests/baselines/*/; do
            ( cd "$d"; ls -1t *.json 2>/dev/null | tail -n +21 | xargs -r rm -f ) || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/baselines
          if git diff --cached --quiet; then echo "no baseline change"; exit 0; fi
          git commit -q -m "perf: main baseline ${GITHUB_SHA::7}"
          git push -q origin perf-baseline:perf-baseline

      - name: "上传基线（仅传输副本）"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: tests/baselines/
          retention-days: 30

  # ════════════════════════════════════════════════════════
  # Layer 2b: Sanitizer 检查（仅 workflow_dispatch 手动触发）
  # ASAN+UBSAN 构建，每模块 10min，~1h
  # ════════════════════════════════════════════════════════
  sanitizer-check:
    name: "Sanitizer 检查（ASAN+UBSAN）"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ["self-hosted", "linux"]
    timeout-minutes: 90
    steps:
      - name: "拉取代码库"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: "构建 Sanitizer 版"
        run: bash scripts/build_sanitizer.sh build

      - name: "运行 Sanitizer 测试（6 模块 × 10min）"
        run: bash scripts/build_sanitizer.sh run 600

      - name: "上传 ASAN 报告"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-reports
          path: /tmp/asan_report.*
          if-no-files-found: warn
          retention-days: 7
