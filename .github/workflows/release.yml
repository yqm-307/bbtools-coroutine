name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: "发布类型（须先获得用户授权）"
        required: true
        type: choice
        options: [rc, stable]
      version:
        description: "vX.Y.Z-rcN 或 vX.Y.Z"
        required: true
        type: string
      source_sha:
        description: "完整 40 位 commit SHA"
        required: true
        type: string
      rc_tag:
        description: "Stable 来源 RC tag；RC 留空"
        required: false
        type: string
      soak_seconds:
        description: "疲劳压测时长（秒，60-86400），默认 3600；发布前可提高到数小时-数十小时"
        required: false
        type: string
        default: "3600"

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_KIND: ${{ inputs.release_kind }}
  VERSION: ${{ inputs.version }}
  SOURCE_SHA: ${{ inputs.source_sha }}
  RC_TAG: ${{ inputs.rc_tag }}
  SOAK_SECONDS: ${{ inputs.soak_seconds }}
  OUTDIR: tests/reports/release-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  gate:
    name: "Release Gate"
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux]
    # 默认 1h 压测 + 构建/测试/性能 Gate；压测可加长到 24h，给足超时。
    timeout-minutes: 1500
    permissions:
      contents: write  # 仅用于发布 Gate 通过后推送 perf-baseline 基线
    steps:
      - name: "固定受信任流程版本"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: "发布工具自测"
        run: python3 scripts/test_release_gate.py

      - name: "验证发布资格及精确 SHA 的 main CI"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_gate.py validate --kind "$RELEASE_KIND" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" --rc-tag "$RC_TAG" \
            --soak-seconds "$SOAK_SECONDS"

      - name: "拉取已校验的候选源码"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false

      - name: "发布基线预检（缺失提前失败，不跳过 Gate）"
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          if ! git -C source ls-remote --exit-code origin refs/heads/perf-baseline >/dev/null; then
            echo '::error::发布缺少可访问的 perf-baseline；先完成 main 长测和基线记录'
            exit 2
          fi
          git -C source fetch --depth=25 origin refs/heads/perf-baseline
          git -C source checkout FETCH_HEAD -- tests/baselines

      - name: "Release 库构建（测试和示例沿用 CMake 的 Debug 子目录）"
        run: |
          cmake -S source -B source/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DNEED_TEST=ON -DNEED_BENCHMARK=ON -DNEED_EXAMPLE=ON
          cmake --build source/build -j2

      - name: "全量 CTest"
        timeout-minutes: 15
        run: ctest --test-dir source/build --timeout 60 --output-on-failure

      - name: "真实客户端验收（Redis 缺失必须失败）"
        timeout-minutes: 10
        run: |
          python3 source/scripts/acceptance_real_clients.py \
            --echo-server ./source/build/bin/example/echo_server \
            --hiredis ./source/build/bin/example/co_with_hiredis

      - name: "性能发布 Gate"
        run: |
          python3 source/scripts/ci_perf_check.py --threads=2 --dur=45 --gate-enabled \
            --output source/tests/ci-reports/release-performance.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('source/tests/ci-reports/release-performance.json').read_text())
          modules = report.get('modules', {})
          assert set(modules) == {'comutex', 'corwmutex', 'cocond', 'chan', 'copool', 'coroutine'}
          assert report.get('verdict') in {'PASS', 'WARN'}
          assert all(m.get('status') in {'PASS', 'WARN'} and m.get('errors') == 0 for m in modules.values())
          commit = report.get('commit', '')
          assert len(commit) >= 7 and os.environ['SOURCE_SHA'].startswith(commit)
          PY

      - name: "并行疲劳压测（时长由 soak_seconds 控制）"
        working-directory: source
        run: |
          PROJECT_ROOT="$GITHUB_WORKSPACE/source" INTERVAL=60 \
            bash ../scripts/run_parallel_stress.sh "$SOAK_SECONDS" 2
          test -s "$OUTDIR/summary.txt"

      - name: "记录性能基线（仅发布 Gate 通过后写入）"
        working-directory: source
        run: |
          python3 scripts/record_baseline.py record --threads=2 --dur=60 --quick
          echo "Baseline recorded:"
          ls -la tests/baselines/*/

      - name: "趋势检查（连续小幅退化，非阻断）"
        working-directory: source
        run: |
          if ! python3 scripts/record_baseline.py trend; then
            echo "::warning::检测到连续性能退化趋势，请创建专项修复 Issue（见 docs/ci-guide.md）"
          fi

      - name: "推送基线到 perf-baseline 分支（长期记录）"
        working-directory: source
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          work="$(mktemp -d)"; cd "$work"
          git init -q bl && cd bl
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)"
          if git ls-remote --exit-code origin refs/heads/perf-baseline >/dev/null 2>&1; then
            git fetch -q --depth=25 origin refs/heads/perf-baseline
            git checkout -q -b perf-baseline FETCH_HEAD
          else
            git checkout -q --orphan perf-baseline
          fi
          mkdir -p tests/baselines
          cp -r "$GITHUB_WORKSPACE/source/tests/baselines/." tests/baselines/
          for d in tests/baselines/*/; do
            ( cd "$d"; ls -1t *.json 2>/dev/null | tail -n +21 | xargs -r rm -f ) || true
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tests/baselines
          if git diff --cached --quiet; then echo "no baseline change"; exit 0; fi
          git commit -q -m "perf: release baseline ${SOURCE_SHA::7}"
          git push -q origin perf-baseline:perf-baseline

      - name: "发布证据索引"
        if: success()
        run: |
          printf 'Source SHA: `%s`\nWorkflow SHA: `%s`\nVersion: `%s`\nSoak seconds: `%s`\n' \
            "$SOURCE_SHA" "$GITHUB_SHA" "$VERSION" "$SOAK_SECONDS" | tee release-evidence.md >> "$GITHUB_STEP_SUMMARY"

      - name: "保留发布证据"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence.md
            source/tests/reports/release-*/
            source/tests/ci-reports/release-performance.*
            source/tests/baselines/
            source/build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: "Publish GitHub Release"
    needs: [gate]
    if: github.ref == 'refs/heads/main'
    # 独立一次性 runner；候选构建不接触发布凭据。
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.release_kind == 'stable' && 'release-stable' || 'release-rc' }}
    permissions:
      contents: write
      actions: read
    steps:
      - name: "使用与 Gate 相同的受信任发布脚本"
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: "审核后重新验证并创建 Release"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG_SSH_KEY: ${{ secrets.RELEASE_TAG_SSH_KEY }}
        run: |
          python3 scripts/release_gate.py publish --kind "$RELEASE_KIND" \
            --version "$VERSION" --source-sha "$SOURCE_SHA" --rc-tag "$RC_TAG" \
            --soak-seconds "$SOAK_SECONDS"
